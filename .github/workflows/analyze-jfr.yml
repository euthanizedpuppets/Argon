name: Analyze uploaded Argon JFR recording

on:
  push:
    branches: ["analysis/jfr-village"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Summarize JFR events and CPU samples
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out recording
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Validate and summarize recording
        shell: bash
        run: |
          set -euo pipefail
          test -s test/argon-village.jfr
          echo "=== Recording file ==="
          ls -lh test/argon-village.jfr
          echo
          echo "=== JFR event summary ==="
          jfr summary test/argon-village.jfr | tee jfr-summary.txt
          echo
          echo "=== Export selected events to JSON ==="
          jfr print --json --events jdk.ExecutionSample,jdk.NativeMethodSample,jdk.ThreadCPULoad,jdk.CPULoad,jdk.ObjectAllocationSample,jdk.GCHeapSummary,jdk.GCPhasePause,jdk.GarbageCollection,jdk.JavaMonitorEnter,jdk.ThreadPark,jdk.FileRead,jdk.SocketRead,jdk.JavaExceptionThrow,jdk.JavaErrorThrow test/argon-village.jfr > jfr-events.json
          python3 - <<'PY'
          import collections
          import datetime
          import json
          import re
          from pathlib import Path

          root = json.loads(Path("jfr-events.json").read_text())
          recording = root.get("recording", root)
          events = recording.get("events", [])
          counts = collections.Counter()
          java_threads = collections.Counter()
          native_threads = collections.Counter()
          java_leaf = collections.Counter()
          native_leaf = collections.Counter()
          java_inclusive = collections.Counter()
          java_thread_leaf = collections.defaultdict(collections.Counter)
          java_stacks = collections.Counter()
          alloc_count = collections.Counter()
          alloc_weight = collections.Counter()
          cpu_load = collections.defaultdict(list)
          pause_durations = []
          gc_collections = []
          waits = []
          exceptions = collections.Counter()
          exception_messages = collections.Counter()
          exception_sites = collections.Counter()
          exception_stacks = collections.Counter()
          timed_java_samples = []
          start_times = []

          def method_name(frame):
              method = frame.get("method") or {}
              typ = method.get("type") or {}
              return f"{typ.get('name', '?')}.{method.get('name', '?')}"

          def thread_name(values):
              for key in ("sampledThread", "eventThread", "thread"):
                  value = values.get(key)
                  if isinstance(value, dict):
                      return value.get("javaName") or value.get("osName") or value.get("name") or "?"
              return "?"

          def event_time(values):
              value = values.get("startTime")
              if not isinstance(value, str):
                  return None
              try:
                  return datetime.datetime.fromisoformat(value.replace("Z", "+00:00"))
              except ValueError:
                  return None

          def duration_seconds(value):
              if not isinstance(value, str):
                  return None
              # JFR JSON uses ISO-8601 values such as PT0.0005S.
              m = re.fullmatch(r"PT(?:(\d+(?:\.\d+)?)H)?(?:(\d+(?:\.\d+)?)M)?(?:(\d+(?:\.\d+)?)S)?", value)
              if not m:
                  return None
              h, minute, second = (float(x or 0) for x in m.groups())
              return h * 3600 + minute * 60 + second

          for event in events:
              typ = event.get("type", "?")
              counts[typ] += 1
              values = event.get("values") or {}
              when = event_time(values)
              if when:
                  start_times.append(when)

              if typ == "jdk.ExecutionSample":
                  thread = thread_name(values)
                  java_threads[thread] += 1
                  trace = values.get("stackTrace") or {}
                  frames = trace.get("frames", []) if isinstance(trace, dict) else []
                  names = [method_name(frame) for frame in frames if isinstance(frame, dict)]
                  if names:
                      java_leaf[names[0]] += 1
                      java_thread_leaf[thread][names[0]] += 1
                      java_stacks[" -> ".join(names[:7])] += 1
                      java_inclusive.update(set(names))
                      timed_java_samples.append((when, thread, names[0], names))
              elif typ == "jdk.NativeMethodSample":
                  thread = thread_name(values)
                  native_threads[thread] += 1
                  trace = values.get("stackTrace") or {}
                  frames = trace.get("frames", []) if isinstance(trace, dict) else []
                  names = [method_name(frame) for frame in frames if isinstance(frame, dict)]
                  if names:
                      native_leaf[names[0]] += 1
              elif typ == "jdk.ObjectAllocationSample":
                  cls = values.get("objectClass")
                  name = cls.get("name", "?") if isinstance(cls, dict) else str(cls or "?")
                  alloc_count[name] += 1
                  weight = values.get("weight")
                  if isinstance(weight, (int, float)):
                      alloc_weight[name] += weight
              elif typ == "jdk.ThreadCPULoad":
                  thread = thread_name(values)
                  user = values.get("user", 0)
                  system = values.get("system", 0)
                  if isinstance(user, (int, float)) and isinstance(system, (int, float)):
                      cpu_load[thread].append((user + system) * 100.0)
              elif typ in ("jdk.JavaExceptionThrow", "jdk.JavaErrorThrow"):
                  thrown = values.get("thrownClass")
                  name = thrown.get("name", "?") if isinstance(thrown, dict) else str(thrown or "?")
                  exceptions[(typ, name)] += 1
                  message = values.get("message")
                  if message:
                      exception_messages[(typ, name, str(message)[:180])] += 1
                  trace = values.get("stackTrace") or {}
                  frames = trace.get("frames", []) if isinstance(trace, dict) else []
                  names = [method_name(frame) for frame in frames if isinstance(frame, dict)]
                  if names:
                      exception_sites[(typ, name, names[0])] += 1
                      exception_stacks[(typ, name, " -> ".join(names[:6]))] += 1
              elif typ == "jdk.GCPhasePause":
                  d = duration_seconds(values.get("duration"))
                  if d is not None:
                      pause_durations.append((d, values.get("name")))
              elif typ == "jdk.GarbageCollection":
                  gc_collections.append({
                      "name": values.get("name"),
                      "cause": values.get("cause"),
                      "duration": values.get("duration"),
                      "sumOfPauses": values.get("sumOfPauses"),
                      "longestPause": values.get("longestPause")
                  })
              elif typ in ("jdk.JavaMonitorEnter", "jdk.ThreadPark"):
                  waits.append({
                      "type": typ,
                      "thread": thread_name(values),
                      "duration": values.get("duration"),
                      "monitorClass": values.get("monitorClass"),
                      "parkedClass": values.get("parkedClass")
                  })

          def show(title, counter, limit=25):
              print(f"\n=== {title} ===")
              for name, count in counter.most_common(limit):
                  print(f"{count:6}  {name}")

          print("=== Recording analysis ===")
          print(f"Events decoded: {len(events)}")
          print(f"Sample event time range: {min(start_times) if start_times else 'unknown'} to {max(start_times) if start_times else 'unknown'}")
          show("All event counts", counts, 45)
          show("Thrown exception/error classes", collections.Counter({f"{k[0]} {k[1]}": v for k, v in exceptions.items()}), 30)
          show("Frequent exception/error throw sites", collections.Counter({f"{k[0]} {k[1]} at {k[2]}": v for k, v in exception_sites.items()}), 30)
          show("Frequent exception/error messages", collections.Counter({f"{k[0]} {k[1]}: {k[2]}": v for k, v in exception_messages.items()}), 25)
          show("Java execution samples by thread (CPU stack samples)", java_threads, 30)
          show("Java execution sample leaf methods (not exact CPU percent)", java_leaf, 35)
          show("Java methods appearing in sampled stacks (inclusive indicator)", java_inclusive, 40)
          show("Native method samples by thread (includes blocking/native waits)", native_threads, 25)
          show("Native sample leaf methods (not necessarily CPU-busy)", native_leaf, 30)

          for thread in ("main", "Render thread", "Server thread", "Worker-Main-1", "Worker-Main-2", "Worker-Main-3", "Worker-Main-4"):
              if java_thread_leaf.get(thread):
                  show(f"Java leaf methods on {thread}", java_thread_leaf[thread], 20)

          show("Most common Java sample stack traces", java_stacks, 20)
          show("Allocation sample counts by class (sampling, not exact totals)", alloc_count, 25)
          show("Allocation sampled weight by class (bytes are approximate sampler weights)", alloc_weight, 25)

          print("\n=== Thread CPU load samples (average reported per-thread total %) ===")
          for name, values in sorted(cpu_load.items(), key=lambda item: sum(item[1]) / len(item[1]), reverse=True):
              print(f"{sum(values)/len(values):6.1f}% avg from {len(values):3} samples  {name}")

          print("\n=== Garbage collection summary ===")
          print(f"GC collection events: {len(gc_collections)}")
          if pause_durations:
              print(f"JFR GC pause-phase events: {len(pause_durations)}; total reported phase duration: {sum(x[0] for x in pause_durations)*1000:.3f} ms; maximum individual phase: {max(x[0] for x in pause_durations)*1000:.3f} ms")
              show("GC pause phase names", collections.Counter(name for _, name in pause_durations), 30)
          for item in gc_collections[:30]:
              print(json.dumps(item, sort_keys=True))

          print("\n=== Slow monitor/park event examples (top 20 by duration) ===")
          for item in sorted(waits, key=lambda x: duration_seconds(x.get("duration")) or 0, reverse=True)[:20]:
              print(json.dumps(item, sort_keys=True))

          # Show whether notable Java hot methods are concentrated early or late.
          if timed_java_samples and start_times:
              lo, hi = min(start_times), max(start_times)
              span = max((hi - lo).total_seconds(), 1.0)
              thirds = collections.defaultdict(collections.Counter)
              for when, thread, leaf, names in timed_java_samples:
                  if when is None:
                      continue
                  sec = (when - lo).total_seconds()
                  bucket = min(2, int(sec / span * 3))
                  thirds[bucket][leaf] += 1
              for bucket in range(3):
                  show(f"Java leaf methods in time segment {bucket+1}/3", thirds[bucket], 15)

          out = [
              "All event counts", "\n".join(f"{k}: {v}" for k, v in counts.most_common()),
              "Java execution samples by thread", "\n".join(f"{k}: {v}" for k, v in java_threads.most_common()),
              "Java leaf methods", "\n".join(f"{k}: {v}" for k, v in java_leaf.most_common(100)),
              "Native leaf methods", "\n".join(f"{k}: {v}" for k, v in native_leaf.most_common(100)),
              "Java inclusive methods", "\n".join(f"{k}: {v}" for k, v in java_inclusive.most_common(150)),
              "Java sample stacks", "\n".join(f"{k}: {v}" for k, v in java_stacks.most_common(80)),
              "Allocation sampled weights", "\n".join(f"{k}: {v}" for k, v in alloc_weight.most_common(100)),
              "Thread CPU load", "\n".join(f"{k}: avg={sum(v)/len(v):.3f} samples={len(v)}" for k, v in cpu_load.items()),
              "GC pauses", f"count={len(pause_durations)} sum_ms={sum(x[0] for x in pause_durations)*1000:.3f} max_ms={max((x[0] for x in pause_durations), default=0)*1000:.3f}",
              "GC collections", "\n".join(json.dumps(x, sort_keys=True) for x in gc_collections),
          ]
          Path("jfr-analysis-summary.txt").write_text("\n\n".join(out))
          PY

      - name: Upload compact JFR analysis
        uses: actions/upload-artifact@v4
        with:
          name: argon-jfr-analysis-summary
          path: |
            jfr-summary.txt
            jfr-analysis-summary.txt
          if-no-files-found: error
          retention-days: 14
