name: Argon CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: argon-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Compile and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Print toolchain versions
        run: |
          java -version
          gradle --version

      - name: Compile, test, and package
        run: gradle --no-daemon clean test build

      - name: Upload Argon JAR
        uses: actions/upload-artifact@v4
        with:
          name: argon-0.1.0
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
