plugins {
    id "net.fabricmc.fabric-loom" version "${loom_version}"
    id "java"
}

group = project.maven_group
version = project.mod_version
base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        url = "https://maven.fabricmc.net/"
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    testImplementation platform("org.junit:junit-bom:5.12.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = "UTF-8"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events "failed", "skipped"
    }
}

/*
 * Compilation alone cannot prove that a client Mixin is named in metadata.
 * Catch common packaging/config mistakes before asking someone to launch MC.
 */
tasks.register("verifyArgonMixinConfiguration") {
    group = "verification"
    description = "Validates Argon's required client Mixin metadata and source targets."

    def metadataFile = file("src/main/resources/fabric.mod.json")
    def mixinConfigFile = file("src/main/resources/argon.client.mixins.json")
    def mixinSourceDir = file("src/main/java/dev/argon/mixin/chunk")

    inputs.files(metadataFile, mixinConfigFile)
    inputs.dir(mixinSourceDir)

    doLast {
        def parser = new groovy.json.JsonSlurper()
        def metadata = parser.parse(metadataFile)
        def mixinConfig = parser.parse(mixinConfigFile)

        if (metadata.icon != "assets/argon/icon.png") {
            throw new GradleException("fabric.mod.json must declare the bundled assets/argon/icon.png icon.")
        }
        if (!file("src/main/resources/${metadata.icon}").isFile()) {
            throw new GradleException("The declared Argon icon is missing from src/main/resources.")
        }

        def registered = metadata.mixins instanceof Collection && metadata.mixins.any { entry ->
            entry instanceof Map
                    && entry.config == "argon.client.mixins.json"
                    && entry.environment == "client"
        }
        if (!registered) {
            throw new GradleException(
                    "fabric.mod.json must register argon.client.mixins.json for the client.")
        }

        if (mixinConfig.required != true) {
            throw new GradleException("Argon's target-specific Mixin config must stay required.")
        }
        if (mixinConfig.compatibilityLevel != "JAVA_25") {
            throw new GradleException("Argon's Mixin compatibilityLevel must be JAVA_25.")
        }
        if (!(mixinConfig.client instanceof Collection) || mixinConfig.client.isEmpty()) {
            throw new GradleException("Argon's client Mixin list is missing or empty.")
        }

        def packagePath = mixinConfig.package.replace(".", "/")
        def missingSources = mixinConfig.client.findAll { name ->
            !file("src/main/java/${packagePath}/${name}.java").isFile()
        }
        if (!missingSources.isEmpty()) {
            throw new GradleException(
                    "Mixin classes listed in argon.client.mixins.json have no source: ${missingSources}")
        }

        def accessor = file("src/main/java/dev/argon/mixin/chunk/SectionTaskCancellationAccessor.java")
                .getText("UTF-8")
        def queueMixin = file("src/main/java/dev/argon/mixin/chunk/SectionTaskDynamicQueueMixin.java")
                .getText("UTF-8")

        if (!accessor.contains('@Mixin(targets = "net.minecraft.client.renderer.chunk.SectionRenderDispatcher$RenderSection$SectionTask")')
                || !accessor.contains('@Accessor("isCancelled")')) {
            throw new GradleException(
                    "SectionTask cancellation accessor no longer matches the selected Minecraft ${project.minecraft_version} target.")
        }
        if (!queueMixin.contains("@Mixin(SectionTaskDynamicQueue.class)")
                || !queueMixin.contains('@Inject(method = "add", at = @At("HEAD"))')
                || !queueMixin.contains('@Inject(method = "add", at = @At("TAIL"))')
                || !queueMixin.contains('@Inject(method = "poll", at = @At("RETURN"))')
                || !queueMixin.contains('@Inject(method = "clear", at = @At("HEAD"))')
                || !queueMixin.contains('@Inject(method = "clear", at = @At("TAIL"))')
                || !queueMixin.contains("List<SectionTask>")) {
            throw new GradleException(
                    "Native chunk queue Mixin target or instrumentation hook changed; review before packaging.")
        }

        def compileTaskMixin = file("src/main/java/dev/argon/mixin/chunk/SectionCompileTaskMixin.java")
                .getText("UTF-8")
        def terrainObserverMixin = file("src/main/java/dev/argon/mixin/chunk/ChunkSectionsToRenderMixin.java")
                .getText("UTF-8")
        if (!terrainObserverMixin.contains("@Mixin(ChunkSectionsToRender.class)")
                || !terrainObserverMixin.contains('@Inject(method = "renderGroup", at = @At("HEAD"))')
                || !terrainObserverMixin.contains('@Inject(method = "renderGroup", at = @At("RETURN"))')) {
            throw new GradleException(
                    "Terrain render observer target or timing hook changed; review before packaging.")
        }

        def dispatcherMixin = file("src/main/java/dev/argon/mixin/chunk/SectionRenderDispatcherMixin.java")
                .getText("UTF-8")

        if (!compileTaskMixin.contains('@Mixin(targets = "net.minecraft.client.renderer.chunk.SectionRenderDispatcher$RenderSection$CompileTask")')
                || !compileTaskMixin.contains('@Inject(method = "doTask", at = @At("HEAD"))')
                || !compileTaskMixin.contains('@Inject(method = "doTask", at = @At("RETURN"))')) {
            throw new GradleException(
                    "Section mesh compile timing mixin target or injection point changed; review before packaging.")
        }
        if (!dispatcherMixin.contains("@Mixin(SectionRenderDispatcher.class)")
                || !dispatcherMixin.contains('@Inject(method = "uploadTerrainBuffersToGpu", at = @At("HEAD"))')
                || !dispatcherMixin.contains('@Inject(method = "uploadTerrainBuffersToGpu", at = @At("RETURN"))')) {
            throw new GradleException(
                    "Terrain upload timing mixin target or injection point changed; review before packaging.")
        }

        logger.lifecycle("Argon client Mixin metadata and Minecraft ${project.minecraft_version} target declarations verified.")
    }
}

tasks.named("check") {
    dependsOn("verifyArgonMixinConfiguration")
}

tasks.named("build") {
    dependsOn("verifyArgonMixinConfiguration")
}

jar {
    from("README.md") {
        into "META-INF"
    }
}
